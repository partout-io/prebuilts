name: Vendor Prebuilts
run-name: Vendor Prebuilts (${{ inputs.vendor || 'all' }})

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Vendor to build across all supported platforms
        required: false
        type: choice
        default: all
        options:
          - all
          - openssl
          - mbedtls
          - wg-go
          - wintun

permissions:
  contents: read

env:
  ANDROID_API: "28"
  ANDROID_NDK_VERSION: "30.0.14904198"
  LLVM_MINGW_VERSION: "20260616"
  LLVM_MINGW_FLAVOR: ucrt
  MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
  NASM_VERSION: "3.01"
  NASM_SOURCE_SHA256: e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4

jobs:
  select-matrix:
    name: Select matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select vendor matrix
        id: matrix
        shell: bash
        run: |
          vendor="${{ inputs.vendor }}"
          if [ -z "${vendor}" ]; then
            vendor="all"
          fi

          llvm_mingw_sha256="b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"
          apple_openssl='{"target":"apple-openssl-xcframework","runner":"macos-26","build_host":"apple","vendor":"openssl"}'
          apple_mbedtls='{"target":"apple-mbedtls-xcframework","runner":"macos-26","build_host":"apple","vendor":"mbedtls"}'
          apple_wg_go='{"target":"apple-wg-go-xcframework","runner":"macos-26","build_host":"apple","vendor":"wg-go"}'
          android_openssl='{"target":"android-arm64-v8a","runner":"ubuntu-24.04","build_host":"linux","vendor":"openssl"}'
          android_mbedtls='{"target":"android-arm64-v8a","runner":"ubuntu-24.04","build_host":"linux","vendor":"mbedtls"}'
          android_wg_go='{"target":"android-arm64-v8a","runner":"ubuntu-24.04","build_host":"linux","vendor":"wg-go"}'
          linux_x64_wg_go='{"target":"linux-x64","runner":"ubuntu-24.04","build_host":"linux","vendor":"wg-go"}'
          linux_arm64_wg_go='{"target":"linux-arm64","runner":"ubuntu-24.04-arm","build_host":"linux","vendor":"wg-go"}'
          windows_x64_openssl='{"target":"windows-x64","runner":"windows-2022","build_host":"windows","vendor":"openssl","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"x86_64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_x64_mbedtls='{"target":"windows-x64","runner":"windows-2022","build_host":"windows","vendor":"mbedtls","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"x86_64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_x64_wg_go='{"target":"windows-x64","runner":"windows-2022","build_host":"windows","vendor":"wg-go","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"x86_64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_x64_wintun='{"target":"windows-x64","runner":"windows-2022","build_host":"windows","vendor":"wintun","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"x86_64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_arm64_openssl='{"target":"windows-arm64","runner":"windows-2022","build_host":"windows","vendor":"openssl","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"aarch64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_arm64_mbedtls='{"target":"windows-arm64","runner":"windows-2022","build_host":"windows","vendor":"mbedtls","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"aarch64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_arm64_wg_go='{"target":"windows-arm64","runner":"windows-2022","build_host":"windows","vendor":"wg-go","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"aarch64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          windows_arm64_wintun='{"target":"windows-arm64","runner":"windows-2022","build_host":"windows","vendor":"wintun","llvm_mingw_host_arch":"x86_64","llvm_mingw_triple":"aarch64-w64-mingw32","llvm_mingw_sha256":"'"${llvm_mingw_sha256}"'"}'
          case "${vendor}" in
            all)
              matrix='{"include":['"${apple_openssl}"','"${apple_mbedtls}"','"${apple_wg_go}"','"${android_openssl}"','"${android_mbedtls}"','"${android_wg_go}"','"${linux_x64_wg_go}"','"${linux_arm64_wg_go}"','"${windows_x64_openssl}"','"${windows_x64_mbedtls}"','"${windows_x64_wg_go}"','"${windows_x64_wintun}"','"${windows_arm64_openssl}"','"${windows_arm64_mbedtls}"','"${windows_arm64_wg_go}"','"${windows_arm64_wintun}"']}'
              ;;
            openssl)
              matrix='{"include":['"${apple_openssl}"','"${android_openssl}"','"${windows_x64_openssl}"','"${windows_arm64_openssl}"']}'
              ;;
            mbedtls)
              matrix='{"include":['"${apple_mbedtls}"','"${android_mbedtls}"','"${windows_x64_mbedtls}"','"${windows_arm64_mbedtls}"']}'
              ;;
            wg-go)
              matrix='{"include":['"${apple_wg_go}"','"${android_wg_go}"','"${linux_x64_wg_go}"','"${linux_arm64_wg_go}"','"${windows_x64_wg_go}"','"${windows_arm64_wg_go}"']}'
              ;;
            wintun)
              matrix='{"include":['"${windows_x64_wintun}"','"${windows_arm64_wintun}"']}'
              ;;
            *)
              echo "Unknown vendor: ${vendor}" >&2
              exit 1
              ;;
          esac

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.build_host == 'apple' && matrix.target || format('{0}-{1}', matrix.target, matrix.vendor) }}
    needs: select-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}

    steps:
      - name: Check out prebuilts
        uses: actions/checkout@v7

      - name: Prepare vendor sources
        shell: bash
        run: scripts/checkout-vendors.sh "${{ matrix.vendor }}"

      - name: Set up Go from runner image
        if: matrix.vendor == 'wg-go'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: vendors/wg-go/go.sum

      - name: Select Android NDK
        if: startsWith(matrix.target, 'android-')
        shell: bash
        run: |
          ndk_dir="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "${ndk_dir}" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [ -z "${sdkmanager_bin}" ]; then
              sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            fi
            set +o pipefail
            yes | "${sdkmanager_bin}" --install "ndk;${ANDROID_NDK_VERSION}"
            set -o pipefail
          fi
          echo "ANDROID_NDK_ROOT=${ndk_dir}" >> "${GITHUB_ENV}"

      - name: Restore llvm-mingw cache
        id: llvm-mingw-cache
        if: matrix.build_host == 'windows' && matrix.vendor == 'wg-go'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw/${{ env.LLVM_MINGW_VERSION }}-${{ env.LLVM_MINGW_FLAVOR }}-${{ matrix.llvm_mingw_host_arch }}
          key: llvm-mingw-windows-${{ matrix.target }}-${{ env.LLVM_MINGW_VERSION }}-${{ env.LLVM_MINGW_FLAVOR }}-${{ matrix.llvm_mingw_sha256 }}

      - name: Set up llvm-mingw for wg-go
        if: matrix.build_host == 'windows' && matrix.vendor == 'wg-go'
        shell: pwsh
        run: |
          $archive = "llvm-mingw-$env:LLVM_MINGW_VERSION-$env:LLVM_MINGW_FLAVOR-${{ matrix.llvm_mingw_host_arch }}.zip"
          $toolRoot = Join-Path (Join-Path $env:RUNNER_TOOL_CACHE "llvm-mingw") "$env:LLVM_MINGW_VERSION-$env:LLVM_MINGW_FLAVOR-${{ matrix.llvm_mingw_host_arch }}"
          $clang = Join-Path $toolRoot "bin\${{ matrix.llvm_mingw_triple }}-clang.exe"

          if (-not (Test-Path $clang)) {
            New-Item -ItemType Directory -Force $toolRoot | Out-Null

            $archivePath = Join-Path $env:RUNNER_TEMP $archive
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$archive"
            Invoke-WebRequest -Uri $url -OutFile $archivePath

            $actualSha256 = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
            if ($actualSha256 -ne "${{ matrix.llvm_mingw_sha256 }}") {
              throw "Expected llvm-mingw SHA256 ${{ matrix.llvm_mingw_sha256 }}, got $actualSha256"
            }

            $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-${{ matrix.llvm_mingw_host_arch }}"
            Remove-Item -Recurse -Force $extractRoot -ErrorAction SilentlyContinue
            Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
            $expandedRoot = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
            if (-not $expandedRoot) {
              throw "Unable to find extracted llvm-mingw root in $extractRoot"
            }
            Copy-Item -Recurse -Force (Join-Path $expandedRoot.FullName "*") $toolRoot
          }

          if (-not (Test-Path $clang)) {
            throw "Missing expected llvm-mingw clang: $clang"
          }

          "LLVM_MINGW_ROOT=$toolRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clang --version

      - name: Save llvm-mingw cache
        if: matrix.build_host == 'windows' && matrix.vendor == 'wg-go' && steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw/${{ env.LLVM_MINGW_VERSION }}-${{ env.LLVM_MINGW_FLAVOR }}-${{ matrix.llvm_mingw_host_arch }}
          key: ${{ steps.llvm-mingw-cache.outputs.cache-primary-key }}

      - name: Restore NASM cache
        id: nasm-cache
        if: matrix.build_host == 'windows' && matrix.vendor == 'openssl'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/nasm/${{ env.NASM_VERSION }}
          key: nasm-windows-${{ matrix.target }}-${{ env.NASM_VERSION }}-${{ env.NASM_SOURCE_SHA256 }}

      - name: Set up NASM for OpenSSL
        if: matrix.build_host == 'windows' && matrix.vendor == 'openssl'
        shell: pwsh
        run: |
          $nasmRoot = Join-Path (Join-Path $env:RUNNER_TOOL_CACHE "nasm") $env:NASM_VERSION
          $nasmBin = Join-Path $nasmRoot ("nasm-" + $env:NASM_VERSION)
          $nasmExe = Join-Path $nasmBin "nasm.exe"

          if (-not (Test-Path $nasmExe)) {
            New-Item -ItemType Directory -Force $nasmRoot | Out-Null

            $archive = Join-Path $env:RUNNER_TEMP ("nasm-" + $env:NASM_VERSION + "-win64.zip")
            $url = "https://www.nasm.us/pub/nasm/releasebuilds/" + $env:NASM_VERSION + "/win64/nasm-" + $env:NASM_VERSION + "-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive

            $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $env:NASM_SOURCE_SHA256) {
              throw "Expected NASM SHA256 $env:NASM_SOURCE_SHA256, got $actualSha256"
            }

            Expand-Archive -Path $archive -DestinationPath $nasmRoot -Force
          }

          $env:PATH = "$nasmBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $nasmBin
          nasm -v

      - name: Save NASM cache
        if: matrix.build_host == 'windows' && matrix.vendor == 'openssl' && steps.nasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/nasm/${{ env.NASM_VERSION }}
          key: ${{ steps.nasm-cache.outputs.cache-primary-key }}

      - name: Build Linux-hosted vendors for ${{ matrix.target }}
        if: matrix.build_host == 'linux'
        shell: bash
        run: scripts/build-vendors.sh "${{ matrix.target }}" "${{ matrix.vendor }}"

      - name: Build static Apple ${{ matrix.vendor }} XCFramework
        if: matrix.build_host == 'apple'
        shell: bash
        run: scripts/build-apple-xcframeworks.sh all "${{ matrix.vendor }}"

      - name: Build Windows-hosted vendors for ${{ matrix.target }}
        if: matrix.build_host == 'windows'
        shell: pwsh
        run: scripts/build-vendors-windows.ps1 -Target "${{ matrix.target }}" -Vendor "${{ matrix.vendor }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build_host == 'apple' && format('{0}-apple-xcframework', matrix.vendor) || format('{0}-{1}', matrix.vendor, matrix.target) }}
          path: artifacts/*
          if-no-files-found: error
