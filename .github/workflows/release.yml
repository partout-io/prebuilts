name: Release Prebuilts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload assets to.
        required: true
        type: string
      prerelease:
        description: Mark a newly created release as a prerelease.
        required: true
        default: false
        type: boolean
      vendor_prebuilts_run_id:
        description: Full Vendor Prebuilts run ID. Leave blank for latest successful all-vendor run.
        required: false
        type: string
      windows_wxwidgets_run_id:
        description: Windows wxWidgets run ID. Leave blank for latest successful run.
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Release artifacts
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve build runs
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_PREBUILTS_RUN_ID: ${{ inputs.vendor_prebuilts_run_id }}
          WINDOWS_WXWIDGETS_RUN_ID: ${{ inputs.windows_wxwidgets_run_id }}
        run: |
          set -euo pipefail

          vendors_run_id="${VENDOR_PREBUILTS_RUN_ID}"
          if [ -z "${vendors_run_id}" ]; then
            vendors_run_id="$(
              gh run list --workflow vendors.yml --status success --limit 100 \
                --json databaseId,displayTitle \
                --jq 'map(select(.displayTitle == "Vendor Prebuilts (all)")) | .[0].databaseId'
            )"
          fi

          windows_run_id="${WINDOWS_WXWIDGETS_RUN_ID}"
          if [ -z "${windows_run_id}" ]; then
            windows_run_id="$(gh run list --workflow windows-wxwidgets.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi

          if [ -z "${vendors_run_id}" ] || [ "${vendors_run_id}" = "null" ]; then
            echo "No Vendor Prebuilts run ID provided and no successful Vendor Prebuilts run found." >&2
            exit 1
          fi

          if [ -z "${windows_run_id}" ] || [ "${windows_run_id}" = "null" ]; then
            echo "No Windows wxWidgets run ID provided and no successful Windows wxWidgets run found." >&2
            exit 1
          fi

          echo "VENDORS_RUN_ID=${vendors_run_id}" >> "${GITHUB_ENV}"
          echo "WINDOWS_RUN_ID=${windows_run_id}" >> "${GITHUB_ENV}"
          echo "Using Vendor Prebuilts run ${vendors_run_id}"
          echo "Using Windows wxWidgets run ${windows_run_id}"

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/vendor-prebuilts release-assets/windows-wxwidgets
          gh run download "${VENDORS_RUN_ID}" --dir release-assets/vendor-prebuilts
          gh run download "${WINDOWS_RUN_ID}" --dir release-assets/windows-wxwidgets

          required_vendor_artifacts=(
            partout-vendors-apple-openssl-xcframework
            partout-vendors-apple-mbedtls-xcframework
            partout-vendors-apple-wg-go-xcframework
            partout-vendors-android-arm64-v8a
            partout-vendors-windows-x64
            partout-vendors-windows-arm64
          )
          for artifact in "${required_vendor_artifacts[@]}"; do
            if [ ! -d "release-assets/vendor-prebuilts/${artifact}" ]; then
              echo "Vendor Prebuilts run ${VENDORS_RUN_ID} is not a complete all-vendor run: missing ${artifact}" >&2
              exit 1
            fi
          done

          find release-assets -type f -print | sort

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
            exit 0
          fi

          {
            printf 'Prebuilts for %s.\n\n' "${RELEASE_TAG}"
            printf 'Vendor Prebuilts run: %s\n' "${VENDORS_RUN_ID}"
            printf 'Windows wxWidgets run: %s\n' "${WINDOWS_RUN_ID}"
          } > release-notes.md

          args=(--title "${RELEASE_TAG}" --notes-file release-notes.md)
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" "${args[@]}" || gh release view "${RELEASE_TAG}" >/dev/null

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find release-assets -type f \
              ! -path '*/vendor-prebuilts/partout-vendor-build-*/*' \
              | sort
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
